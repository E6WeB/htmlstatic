[package]
name = "e6web/staticstack-forum"
version = "0.1.0"
description = "StaticStack Community Forum API on Wasmer Edge"
entrypoint = "web"

[dependencies]
"php/php" = "^8.3"

[fs]
"/app" = "."

[[command]]
name = "web"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app", "-S", "localhost:8080"]
