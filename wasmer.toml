[package]
name = "e6web/staticstack"
version = "0.1.0"
description = "StaticStack (staticstack.app) - Static Website Toolkit on Wasmer Edge"
license = "CC0-1.0"
entrypoint = "web"

[dependencies]
"php/php" = "^8.3"

[fs]
"/app" = "."

[[command]]
name = "web"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app", "-S", "localhost:8080", "/app/router.php"]

