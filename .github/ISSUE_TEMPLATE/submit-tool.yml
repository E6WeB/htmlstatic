name: "Submit a Tool or Site"
description: "Suggest a new tool, service, or resource for the Static Website Toolkit"
title: "[Submission]: "
labels: ["tool-submission", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for contributing! 🎉
        Use this form to submit a new tool, service, or resource to the **Static Website Toolkit**.
        *Reminder: Zero advertisement and no affiliate links are allowed. Once the site is verified, it will be added to `README.md`.*

  - type: input
    id: tool_name
    attributes:
      label: "Tool or Site Name"
      description: "What is the official name of the tool or service?"
      placeholder: "e.g. Pagefind"
    validations:
      required: true

  - type: input
    id: website_url
    attributes:
      label: "Official Website URL"
      description: "Must be a direct, secure HTTPS URL (no affiliate codes, referral parameters, or link shorteners)."
      placeholder: "https://example.com/"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "Category"
      description: "Which category does this tool belong in?"
      options:
        - "Analytics & Privacy"
        - "Authentication & User Management"
        - "Booking & Scheduling"
        - "Comments & Community"
        - "Contact Forms"
        - "Content Management"
        - "CSS & UI Component Libraries"
        - "Database & Backend-as-a-Service"
        - "Development Tools"
        - "Hosting & Deployment"
        - "Images & Optimization"
        - "Interactive Maps & Geolocation"
        - "Interactive Scripts & Animation"
        - "Live Chat & Support"
        - "Media & Video Players"
        - "Monitoring & Error Tracking"
        - "Newsletters & Email"
        - "Payments & E-commerce"
        - "Search"
        - "Security & Spam Protection"
        - "Static Site Generators"
        - "Surveys & Feedback"
        - "Typography & Web Fonts"
        - "Suggest a New Category"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Short Description"
      description: "Explain what the tool does in one objective sentence (avoid marketing hype)."
      placeholder: "e.g. Static search indexing designed for static websites."
    validations:
      required: true

  - type: checkboxes
    id: checklists
    attributes:
      label: "Submission Verification"
      options:
        - label: "This submission is relevant to building, hosting, or enhancing static websites."
          required: true
        - label: "Zero advertisement & no affiliate links: this is an official link with no tracking or affiliate tags."
          required: true
        - label: "I searched README.md and verified this tool is not already listed."
          required: true
